# PROPOSED METHOD CHANGE - must pass `python gate.py --config configs/proposals/v2.0.0_spreadsheet_pre_post.yaml`
proposal:
  title: "Pre/post run-rate (no control group)"
  author: "E. Sales Ops"
  rationale: "Align with the legacy spreadsheet: compare promo weeks to the store's own pre-promo run-rate."

# ---------------------------------------------------------------------------
# Promotion attribution METHOD definition.
# This file IS the method. Every number the service reports is stamped with
# method_version + a hash of this file. Changing anything here is a method
# change and must pass the recovery gate (python gate.py) before merge.
# See METHOD.md for the full specification and CHANGELOG.md for history.
# ---------------------------------------------------------------------------
method_version: "2.0.0"

baseline:
  pre_period_weeks: 13        # valid weeks used to set the baseline level
  gap_weeks: 1                # buffer immediately before launch (pantry-loading / leakage)
  max_lookback_weeks: 30      # how far back we may walk to find valid weeks
  exclude_holiday_weeks: true # holiday weeks are not "normal" trading
  exclude_promo_weeks: true   # weeks where the same SKUs ran another promotion
  min_valid_weeks: 8          # fewer valid weeks than this -> result refused

controls:
  strategy: none              # matched | all_untreated | random | none
  controls_per_treated: 3     # nearest untreated stores kept per treated store
  exact_match_on: [format, region]  # hard constraint: controls share these store attributes
  match_window_weeks: 26      # pre-period history used to score candidate controls
  match_metric: normalised_rmse

uplift:
  estimator: did_ratio        # difference-in-differences, ratio form

inference:
  bootstrap_iterations: 1000
  confidence_level: 0.95
  seed: 20260101

validation:
  tolerance_pp: 2.0           # |estimated - planted| uplift must be <= this (percentage points)
  min_ci_coverage: 0.80       # share of promos whose CI contains the planted effect
